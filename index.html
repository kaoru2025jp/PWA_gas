<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算書</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
}
input, button {
  margin: 6px 0;
  width: 100%;
  max-width: 300px;
}
</style>
</head>

<body>

<h2>計算書</h2>

S:  <input id="S"  type="number"><br>
B:  <input id="B"  type="number"><br>
O1: <input id="O1" type="number"><br>
O2: <input id="O2" type="number"><br>
<button onclick="calc()">計算して送信</button>
<p>結果 T = <span id="result"></span></p>

<h3>貸借対照表</h3>
<table border="1" cellpadding="6">
  <tr>
    <th>借方</th>
    <th>金額</th>
    <th>貸方</th>
    <th>金額</th>
  </tr>
  <tr>
    <td>流動資産</td>
    <td id="ca"></td>
    <td>流動負債</td>
    <td id="cl"></td>
  </tr>
  <tr>
    <td>固定資産</td>
    <td id="fa"></td>
    <td>資本金</td>
    <td id="capital"></td>
  </tr>
</table>
  
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxInAOQKzl3SiwVwm0i9rV9DhSRZHIF7XIA3lHVWZQruf2i4fUOdMx0Le3Mlzj44k81cQ/exec";

function calc() {
  const S  = parseFloat(document.getElementById("S").value);
  const B  = parseFloat(document.getElementById("B").value);
  const O1 = parseFloat(document.getElementById("O1").value);
  const O2 = parseFloat(document.getElementById("O2").value);

  // 新しい方程式
  const T1 = (B - S) / O1;
  const T2 = (B - S) / O2;

  // 表示用（例：合計 or 平均など用途に応じて）
  const T = (T1 + T2).toFixed(2);

  document.getElementById("result").textContent = T;

  // ===== 追加計算 =====

  // 流動資産・流動負債
  const currentAssets = O1 * T1;
  const currentLiabilities = O2*T2;

  // 固定資産・資本金
  const fixedAssets = B - currentAssets;
  const capital = B - currentLiabilities;

  // 表示（小数2桁）
  document.getElementById("ca").textContent = currentAssets.toFixed(2);
  document.getElementById("cl").textContent = currentLiabilities.toFixed(2);
  document.getElementById("fa").textContent = fixedAssets.toFixed(2);
  document.getElementById("capital").textContent = capital.toFixed(2);

  
  const callbackName = "cb_" + Date.now();
  window[callbackName] = function(res) {
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src =
    GAS_URL +
    "?t=" + encodeURIComponent(T) +
    "&callback=" + callbackName;

  document.body.appendChild(script);
}
</script>

</body>
</html>
